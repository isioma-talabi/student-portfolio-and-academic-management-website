<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <!-- Fonts: Fraunces & Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css-styles/contact.css" />
  </head>
  <body>
    <!-- Header and Navigation Menus -->
    <header>
      <nav>
        <ul>
          <span id="name-logo">
            <li><a class="name-logo-sty" href="./index.html">Isioma.T</a></li>
          </span>
          <li><a href="./about.html">About Me</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./academicplanner.html">Academic Planner</a></li>
          <span id="contact-btn">
            <li><a href="./contact.html">Contact</a></li>
          </span>
        </ul>
      </nav>
    </header>

    <!-- Main content of the Contact Page Begins here -->

    <main>
      <section>
        <h1>Say Hi! Let's Connect.</h1>
      </section>

      <hr />
      <section class="contact-form-wrapper">
        <form id="contact-form" novalidate>
          <div class="name-wrapper">
            <div>
              <label for="fname">First Name</label> <br />
              <input
                type="text"
                name="fname"
                id="fname"
                placeholder="First name"
              />
            </div>

            <div>
              <label for="lname">Last Name</label> <br />
              <input
                type="text"
                name="lname"
                id="lname"
                placeholder="Last name"
              />
            </div>
          </div>
          <span></span>

          <div class="email-wrapper">
            <label for="email_address">Email Address</label> <br />
            <input
              type="email"
              name="email_address"
              id="email_address"
              placeholder="Your email address"
            />
          </div>

          <div class="phone-wrapper">
            <label for="phone-number">Phone Number</label><br />
            <input
              type="tel"
              id="phone-number"
              name="phone-number"
              placeholder="+(234)-000-000-0000"
            />
          </div>

          <div class="message-wrapper">
            <label for="message">Message</label> <br />
            <input type="text" name="message" id="message" />
          </div>

          <div class="button-wrapper">
            <button id="submit-btn">Submit</button>
          </div>
        </form>

        <section class="contact-image">
          <img src="./assets/sayhi.png" alt="" />
        </section>
      </section>
    </main>
  </body>

  <script src="./scripts/contactform.js"></script>
</html>
